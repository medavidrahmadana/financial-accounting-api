[providers]
providers = ["php"]

[variables]
NIXPACKS_PHP_VERSION = "8.2"

[phases.setup]
nixPkgs = [
  "...",
  "php82Extensions.pdo_mysql",
  "php82Extensions.gd",
  "php82Extensions.zip",
  "php82Extensions.bcmath",
  "php82Extensions.mbstring"
]

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "php artisan config:clear"
]
